# 這個 repo 的兩種失敗都是「靜默」的，所以必須靠 CI 擋：
#
#   1. 漏跑 tools/sync-payloads.mjs -> Windows 使用者拿到舊的 router 或
#      claude-bridge，或是 .ps1 少了 UTF-8 BOM 導致 PowerShell 5.1 中文亂碼。
#      兩者都要等 Windows 使用者實際跑起來才會發現。
#   2. 內嵌負載的語法或行為退步 -> 安裝當下不會報錯，要等實際對話才炸。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.15 起才有 zstdDecompressSync（路由器解 Codex 的壓縮回應會用到）。
        # 24 是 ChatGPT Desktop 內建的那一版，也是多數使用者實際跑的。
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # .sh 是負載的唯一真實來源；.ps1 必須是它同步出來的結果。
      - name: 內嵌負載已同步到 .ps1
        run: node tools/sync-payloads.mjs --check

      - name: 測試
        run: npm test

      - name: bash 安裝器語法
        run: bash -n codex-model-router.sh

      - name: PowerShell 安裝器語法
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './codex-model-router.ps1').Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'codex-model-router.ps1 語法正確'

      # PowerShell 5.1 沒有 BOM 會用 ANSI 代碼頁讀檔，中文訊息整片亂碼。
      # sync-payloads.mjs --check 已涵蓋，這裡再單獨擋一次，因為壞掉的樣子最難認。
      - name: .ps1 保有 UTF-8 BOM
        run: |
          head -c 3 codex-model-router.ps1 | od -An -tx1 | tr -d ' \n' | grep -qx efbbbf \
            || { echo 'codex-model-router.ps1 缺少 UTF-8 BOM'; exit 1; }
